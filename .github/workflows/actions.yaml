name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: swift test
      - run: ./scripts/build.sh
      - run: ditto -c -k --keepParent build/Windower.app build/Windower.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Windower-arm64
          path: build/Windower.zip
